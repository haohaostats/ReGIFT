    <path d="M0 73 C36 72 49 61 72 60 C103 57 118 29 166 26" fill="none" stroke="#A7B5C2" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/>
    <circle cx="66" cy="41" r="7" fill="#8C6BC8" stroke="white" stroke-width="3"/>
    <circle cx="157" cy="5" r="7" fill="#E55B5B" stroke="white" stroke-width="3"/>
  </g>
  <text x="140" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#173B57">ReGIFT</text>
  <text x="140" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#617486">REPLICATE-GUIDED</text>
