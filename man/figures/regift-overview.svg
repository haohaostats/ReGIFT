<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">ReGIFT analysis overview</title>
  <desc id="desc">Replicated single-cell experiments enter a matrix-factorization model that separates generalizable responses, donor deviations, and technical variation.</desc>
  <defs>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F8FC"/><stop offset="1" stop-color="#E8F0F7"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173B57"/><stop offset="1" stop-color="#315F7D"/></linearGradient>
    <linearGradient id="trajectory" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3267C8"/><stop offset="0.52" stop-color="#8C6BC8"/><stop offset="1" stop-color="#E55B5B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173B57" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#405566"/></marker>
  </defs>
  <rect width="1400" height="520" fill="white"/>
  <text x="55" y="54" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#173B57">Replicated single-cell experiment</text>
  <text x="55" y="83" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#617486">biological donors · conditions · cell states</text>

  <g transform="translate(55 112)">
    <rect width="320" height="310" rx="24" fill="url(#softBlue)" stroke="#D6E0E8" stroke-width="2"/>
    <g transform="translate(22 15)">
      <g transform="translate(0 0)"><circle cx="24" cy="24" r="22" fill="white" stroke="#C9D8E4" stroke-width="2"/><circle cx="24" cy="17" r="7" fill="#3267C8"/><path d="M10 40c2-12 8-17 14-17s12 5 14 17" fill="#3267C8"/></g>
      <g transform="translate(56 0)"><circle cx="24" cy="24" r="22" fill="white" stroke="#C9D8E4" stroke-width="2"/><circle cx="24" cy="17" r="7" fill="#2A9D8F"/><path d="M10 40c2-12 8-17 14-17s12 5 14 17" fill="#2A9D8F"/></g>
      <g transform="translate(112 0)"><circle cx="24" cy="24" r="22" fill="white" stroke="#C9D8E4" stroke-width="2"/><circle cx="24" cy="17" r="7" fill="#E55B5B"/><path d="M10 40c2-12 8-17 14-17s12 5 14 17" fill="#E55B5B"/></g>
      <g transform="translate(168 0)"><circle cx="24" cy="24" r="22" fill="white" stroke="#C9D8E4" stroke-width="2"/><circle cx="24" cy="17" r="7" fill="#8C6BC8"/><path d="M10 40c2-12 8-17 14-17s12 5 14 17" fill="#8C6BC8"/></g>
      <g transform="translate(224 0)"><circle cx="24" cy="24" r="22" fill="white" stroke="#C9D8E4" stroke-width="2"/><circle cx="24" cy="17" r="7" fill="#D29A3A"/><path d="M10 40c2-12 8-17 14-17s12 5 14 17" fill="#D29A3A"/></g>
      <text x="136" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#617486">BIOLOGICAL REPLICATES</text>
    </g>

    <g transform="translate(18 91)">
      <!-- Anatomical donor with highlighted tissue -->
      <g transform="translate(0 0)">
        <circle cx="27" cy="10" r="8" fill="#F2C9BD" stroke="#8B6570" stroke-width="1.5"/>
        <path d="M18 23C8 28 7 44 10 58l5 18h24l5-18c3-14 2-30-8-35l-5-3h-8z" fill="#F8FBFD" stroke="#567086" stroke-width="2"/>
        <path d="M15 31L5 55M39 31l10 24M20 75l-4 17M34 75l4 17" fill="none" stroke="#567086" stroke-width="4" stroke-linecap="round"/>
        <path d="M18 48c6-6 14-5 19 0c-5 7-13 9-19 3z" fill="#E98B70" stroke="#B55452" stroke-width="1.5"/>
        <path d="M22 49c4-2 7-2 11 0" fill="none" stroke="#FFF4EF" stroke-width="1.4"/>
      </g>
      <path d="M55 49H76" stroke="#405566" stroke-width="2.5" marker-end="url(#arrow)"/>
      <!-- Isolated organ -->
      <g transform="translate(82 27)">
        <path d="M0 25C12 9 30 7 42 13c12 6 28 2 40 10c-14 16-36 17-55 12c-10-2-19-3-27-10z" fill="#E9A58E" stroke="#9F625C" stroke-width="2"/>
        <path d="M9 25c18-3 41 7 64-1" fill="none" stroke="#F8D4C8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="28" cy="20" r="3" fill="#C65B58"/><circle cx="47" cy="27" r="3" fill="#C65B58"/>
      </g>
      <path d="M165 49H182" stroke="#405566" stroke-width="2.5" marker-end="url(#arrow)"/>
      <!-- Tissue slices -->
      <g transform="translate(188 25)">
        <ellipse cx="24" cy="35" rx="27" ry="10" fill="#E7AFA8" stroke="#9F625C" stroke-width="1.6"/>
        <ellipse cx="24" cy="29" rx="27" ry="10" fill="#F0C8C1" stroke="#9F625C" stroke-width="1.6"/>
        <ellipse cx="24" cy="23" rx="27" ry="10" fill="#F9E2DE" stroke="#9F625C" stroke-width="1.6"/>
        <path d="M6 23c9-5 22-5 35 0c-10 4-22 5-35 0z" fill="#D87973" opacity="0.75"/>
      </g>
      <path d="M241 49H253" stroke="#405566" stroke-width="2.5" marker-end="url(#arrow)"/>
      <!-- Dissociated cells -->
      <g transform="translate(259 24)" stroke="white" stroke-width="2">
        <circle cx="13" cy="14" r="9" fill="#2A9D8F"/><circle cx="31" cy="9" r="8" fill="#3267C8"/><circle cx="45" cy="23" r="9" fill="#E55B5B"/>
        <circle cx="23" cy="31" r="10" fill="#8C6BC8"/><circle cx="42" cy="41" r="8" fill="#D29A3A"/><circle cx="8" cy="44" r="8" fill="#4B91A8"/>
        <g fill="#F7FAFC" stroke="none"><circle cx="13" cy="14" r="3"/><circle cx="31" cy="9" r="3"/><circle cx="45" cy="23" r="3"/><circle cx="23" cy="31" r="3"/><circle cx="42" cy="41" r="3"/><circle cx="8" cy="44" r="3"/></g>
      </g>
      <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#617486" text-anchor="middle">
        <text x="27" y="108">patient</text><text x="123" y="108">tissue</text><text x="212" y="108">slices</text><text x="282" y="108">cells</text>
      </g>
    </g>

    <g transform="translate(20 238)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">
      <text x="0" y="13" fill="#617486">REF</text><rect x="42" y="0" width="238" height="18" rx="9" fill="#DCE6EE"/>
      <text x="0" y="42" fill="#617486">COND</text><rect x="42" y="29" width="238" height="18" rx="9" fill="#F4D9D9"/>
      <g><circle cx="66" cy="9" r="6" fill="#3267C8"/><circle cx="112" cy="9" r="6" fill="#2A9D8F"/><circle cx="158" cy="9" r="6" fill="#E55B5B"/><circle cx="204" cy="9" r="6" fill="#8C6BC8"/><circle cx="250" cy="9" r="6" fill="#D29A3A"/></g>
      <g><circle cx="66" cy="38" r="6" fill="#3267C8"/><circle cx="112" cy="38" r="6" fill="#2A9D8F"/><circle cx="158" cy="38" r="6" fill="#E55B5B"/><circle cx="204" cy="38" r="6" fill="#8C6BC8"/><circle cx="250" cy="38" r="6" fill="#D29A3A"/></g>
    </g>
  </g>

  <path d="M392 267H446" stroke="#405566" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(463 142)" filter="url(#shadow)">
    <rect width="210" height="246" rx="24" fill="white" stroke="#D6E0E8" stroke-width="2"/>
    <text x="105" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#173B57">Expression matrix</text>
    <g transform="translate(29 56)">
      <rect width="152" height="150" rx="7" fill="#F4F7FA"/>
      <g stroke="white" stroke-width="3">
        <path d="M0 0h38v30H0z" fill="#B9D2E8"/><path d="M38 0h38v30H38z" fill="#E9B1A8"/><path d="M76 0h38v30H76z" fill="#315F7D"/><path d="M114 0h38v30h-38z" fill="#F1D4CC"/>
        <path d="M0 30h38v30H0z" fill="#E55B5B"/><path d="M38 30h38v30H38z" fill="#DDEAF3"/><path d="M76 30h38v30H76z" fill="#91B9D6"/><path d="M114 30h38v30h-38z" fill="#274D6B"/>
        <path d="M0 60h38v30H0z" fill="#E8F0F6"/><path d="M38 60h38v30H38z" fill="#C8635C"/><path d="M76 60h38v30H76z" fill="#F2CEC4"/><path d="M114 60h38v30h-38z" fill="#7FAACB"/>
        <path d="M0 90h38v30H0z" fill="#3E6F91"/><path d="M38 90h38v30H38z" fill="#F4E7E1"/><path d="M76 90h38v30H76z" fill="#D98578"/><path d="M114 90h38v30h-38z" fill="#D4E5F0"/>
        <path d="M0 120h38v30H0z" fill="#A4C5DC"/><path d="M38 120h38v30H38z" fill="#315F7D"/><path d="M76 120h38v30H76z" fill="#F2C5BB"/><path d="M114 120h38v30h-38z" fill="#E55B5B"/>
      </g>
    </g>
    <text x="105" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#617486">cells × genes</text>
  </g>

  <path d="M691 267H741" stroke="#405566" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(759 112)" filter="url(#shadow)">
    <rect width="280" height="310" rx="28" fill="url(#core)"/>
    <text x="140" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="white">ReGIFT</text>
    <text x="140" y="77" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#BDD0DE">REPLICATE-GUIDED FACTORIZATION</text>
    <g transform="translate(38 101)">
      <path d="M0 104C42 103 57 85 87 83C121 81 139 37 201 28" fill="none" stroke="url(#trajectory)" stroke-width="8" stroke-linecap="round"/>
      <path d="M0 126C42 125 61 111 91 109C129 106 150 68 205 61" fill="none" stroke="#AFC0CC" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/>
      <circle cx="87" cy="83" r="9" fill="#8C6BC8" stroke="white" stroke-width="3"/><circle cx="201" cy="28" r="9" fill="#E55B5B" stroke="white" stroke-width="3"/>
    </g>
    <g transform="translate(26 254)">
      <rect width="69" height="29" rx="14" fill="#2A9D8F"/><text x="34.5" y="20" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">shared</text>
      <rect x="79" width="82" height="29" rx="14" fill="#8C6BC8"/><text x="120" y="20" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">donor</text>
      <rect x="171" width="83" height="29" rx="14" fill="#D29A3A"/><text x="212.5" y="20" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="white">technical</text>
    </g>
  </g>

  <path d="M1057 267H1109" stroke="#405566" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(1127 112)">
    <rect width="226" height="310" rx="24" fill="#F8FAFC" stroke="#D6E0E8" stroke-width="2"/>
    <text x="113" y="39" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173B57">Interpretable outputs</text>
    <g transform="translate(24 64)">
      <rect width="178" height="58" rx="13" fill="#E6F4F1"/><circle cx="27" cy="29" r="13" fill="#2A9D8F"/><path d="M54 38C79 38 81 20 105 21C127 21 137 10 157 9" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round"/><text x="54" y="55" font-family="Arial" font-size="12" font-weight="700" fill="#246E65">generalizable response</text>
      <rect y="76" width="178" height="58" rx="13" fill="#EFEAF8"/><circle cx="27" cy="105" r="13" fill="#8C6BC8"/><path d="M54 111l27-20l25 13l23-27l28 18" fill="none" stroke="#8C6BC8" stroke-width="4" stroke-linecap="round"/><text x="54" y="129" font-family="Arial" font-size="12" font-weight="700" fill="#665092">donor-specific deviation</text>
      <rect y="152" width="178" height="58" rx="13" fill="#FBF2E2"/><circle cx="27" cy="181" r="13" fill="#D29A3A"/><path d="M55 190l14-20l14 17l14-26l14 24l14-13l14 16l17-25" fill="none" stroke="#D29A3A" stroke-width="3" stroke-linecap="round"/><text x="54" y="205" font-family="Arial" font-size="12" font-weight="700" fill="#956C25">technical variation</text>
    </g>
    <text x="113" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#617486">CPU · interpretable · replicate-aware</text>
  </g>

  <text x="700" y="485" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#173B57">Recover condition responses that generalize across biological replicates</text>
</svg>
