<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">ReGIFT analysis overview</title>
  <desc id="desc">Replicated single-cell experiments enter a matrix-factorization model that separates generalizable responses, donor deviations, and technical variation.</desc>
  <defs>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F8FC"/><stop offset="1" stop-color="#E8F0F7"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173B57"/><stop offset="1" stop-color="#315F7D"/></linearGradient>
    <linearGradient id="trajectory" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3267C8"/><stop offset="0.52" stop-color="#8C6BC8"/><stop offset="1" stop-color="#E55B5B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173B57" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#405566"/></marker>
  </defs>
  <rect width="1400" height="520" fill="white"/>
  <text x="55" y="54" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#173B57">Replicated single-cell experiment</text>
  <text x="55" y="83" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#617486">biological donors · conditions · cell states</text>

  <g transform="translate(55 112)">
    <rect width="320" height="310" rx="24" fill="url(#softBlue)" stroke="#D6E0E8" stroke-width="2"/>
    <g transform="translate(27 29)">
      <g transform="translate(0 0)" fill="#3267C8"><circle cx="22" cy="18" r="12"/><path d="M7 68c0-25 6-39 15-39s15 14 15 39z"/><path d="M11 63l-8 35M33 63l8 35" stroke="#3267C8" stroke-width="7" stroke-linecap="round"/></g>
      <g transform="translate(61 0)" fill="#2A9D8F"><circle cx="22" cy="18" r="12"/><path d="M7 68c0-25 6-39 15-39s15 14 15 39z"/><path d="M11 63l-8 35M33 63l8 35" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round"/></g>
      <g transform="translate(122 0)" fill="#E55B5B"><circle cx="22" cy="18" r="12"/><path d="M7 68c0-25 6-39 15-39s15 14 15 39z"/><path d="M11 63l-8 35M33 63l8 35" stroke="#E55B5B" stroke-width="7" stroke-linecap="round"/></g>
      <g transform="translate(183 0)" fill="#8C6BC8"><circle cx="22" cy="18" r="12"/><path d="M7 68c0-25 6-39 15-39s15 14 15 39z"/><path d="M11 63l-8 35M33 63l8 35" stroke="#8C6BC8" stroke-width="7" stroke-linecap="round"/></g>
      <g transform="translate(244 0)" fill="#D29A3A"><circle cx="22" cy="18" r="12"/><path d="M7 68c0-25 6-39 15-39s15 14 15 39z"/><path d="M11 63l-8 35M33 63l8 35" stroke="#D29A3A" stroke-width="7" stroke-linecap="round"/></g>
    </g>
    <g transform="translate(28 156)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#617486">CONTROL</text>
      <rect x="0" y="15" width="264" height="20" rx="10" fill="#DCE6EE"/><circle cx="31" cy="25" r="8" fill="#3267C8"/><circle cx="82" cy="25" r="8" fill="#2A9D8F"/><circle cx="133" cy="25" r="8" fill="#E55B5B"/><circle cx="184" cy="25" r="8" fill="#8C6BC8"/><circle cx="235" cy="25" r="8" fill="#D29A3A"/>
      <text x="0" y="75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#617486">CONDITION</text>
      <rect x="0" y="90" width="264" height="20" rx="10" fill="#F4D9D9"/><circle cx="31" cy="100" r="8" fill="#3267C8"/><circle cx="82" cy="100" r="8" fill="#2A9D8F"/><circle cx="133" cy="100" r="8" fill="#E55B5B"/><circle cx="184" cy="100" r="8" fill="#8C6BC8"/><circle cx="235" cy="100" r="8" fill="#D29A3A"/>
    </g>
  </g>

